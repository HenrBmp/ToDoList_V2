<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="./index.css">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <script src="./index.js" type="module"></script>
    <title>To Do List 2.0</title>
</head>

<body>
    <div id="root">
        <h3 id="saudacao" class="light-font m1rem">Olá <span id="user" class="colored-font">Usuário</span>!</h3>
        <section id="new-task" class="light-font">
            <h1>Qual tarefa deseja criar?</h1>
            <form>
                <input
                    placeholder="Insira a descrição da tarefa"
                    type="text"
                    name="description-entry"
                    id="description-entry"
                >
                
                <div>
                    <label for="validity-entry">Data de validade:</label>
                    <input
                        type="datetime-local"
                        name="validity-entry"
                        id="validity-entry"
                    >
                </div>
                
                <div>
                    <button id="clear-btn" type="reset">Limpar</button>
                    <button id="create-btn" type="submit">Criar</button>
                </div>
            </form>
        </section>
        <section id="tasks" class="light-font">
        </section>
        <footer id="footer" class="light-font">
            <p>&copy;Henrique Rodrigues</p>
            <p id="reset-name">Clique para redefinir seu nome.</p>
            <p id="reset-tasks">Clique para redefinir suas tarefas.</p>
        </footer>
    </div>
</body>

</html>
